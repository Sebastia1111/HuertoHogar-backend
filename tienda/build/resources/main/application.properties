spring.application.name=tienda
server.port=8083

# ---------- Eureka (opcional) ----------
# Si Eureka esta apagado el servicio funciona igual; solo muestra avisos en la consola
# y se registra solo cuando Eureka arranque (reintenta cada 30 segundos).
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---------- Base de datos: MySQL de Laragon ----------
# La base se crea sola (createDatabaseIfNotExist). Laragon usa root sin clave por defecto.
# Sin MySQL a mano se puede usar H2:  ./gradlew bootRun --args='--spring.profiles.active=h2'
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/huertohogar_tienda?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.h2.console.enabled=false

# ---------- JWT (misma clave que el microservicio usuarios) ----------
jwt.secret=${JWT_SECRET:MEwreeJ2WVKjMTo6eMI6B3KPoHvDFj1T536DgWsgtxzryJ0wUsUNbSYdV+LN2GiT}
jwt.issuer=huertohogar-usuarios

# ---------- Comunicacion con el microservicio usuarios (Eureka o direccion de respaldo) ----------
app.usuarios.service-id=usuarios
# Direccion de respaldo si Eureka no responde
app.usuarios.url=${USUARIOS_URL:http://localhost:8082}

# ---------- CORS (frontend React/Vite) ----------
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173

# ---------- Swagger ----------
# Abrir http://localhost:8083 (redirige a /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json

# El ProductoController original (/api/inventario) sigue funcionando, pero no se muestra:
# su version completa es InventarioApiController (/api/inventario/productos)
springdoc.packages-to-exclude=com.huertohogar.tienda.inventario
