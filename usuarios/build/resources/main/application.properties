spring.application.name=usuarios
server.port=8082

# ---------- Eureka (opcional) ----------
# Si Eureka esta apagado el servicio funciona igual; solo muestra avisos en la consola
# y se registra solo cuando Eureka arranque (reintenta cada 30 segundos).
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---------- Base de datos: MySQL de Laragon ----------
# La base se crea sola (createDatabaseIfNotExist). Laragon usa root sin clave por defecto.
# Sin MySQL a mano se puede usar H2:  ./gradlew bootRun --args='--spring.profiles.active=h2'
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/huertohogar_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.h2.console.enabled=false

# ---------- JWT ----------
# La MISMA clave debe estar en el microservicio tienda (valida los tokens)
jwt.secret=${JWT_SECRET:MEwreeJ2WVKjMTo6eMI6B3KPoHvDFj1T536DgWsgtxzryJ0wUsUNbSYdV+LN2GiT}
jwt.issuer=huertohogar-usuarios
# access token: 15 minutos
jwt.expiracion-ms=900000
# refresh token: 7 dias
jwt.refresh-expiracion-dias=7

# ---------- CORS (frontend React/Vite) ----------
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173

# ---------- Swagger ----------
# Abrir http://localhost:8082 (redirige a /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json
